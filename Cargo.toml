[package]
name = "paping"
version = "0.1.0"
edition = "2024"
description = "TCP port ping: a modern, drop-in compatible rewrite of paping"
license = "MIT"
authors = ["Ariazonaa"]
repository = "https://github.com/Ariazonaa/paping"
readme = "README.md"
exclude = ["docs/superpowers", "docs/images", "examples", "scripts", ".superpowers"]
keywords = ["ping", "tcp", "network", "latency", "cli"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
crossterm = "0.29.0"
ctrlc = "3.5.2"
jiff = "0.2.38"
lexopt = "0.3.2"
ratatui = "0.30.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2.2.2"
rcgen = "0.14.10"
